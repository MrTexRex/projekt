# ============================================================
# Sammenligning af LLM'er på de 50 omskrevne samtaler (40 viderestillinger)
# Kør Main med "config-sammenligning.properties" som Program argument.
# Kun LLM'en skifter mellem kørslerne. Alt andet er ens, så forskellen skyldes modellen.
# ============================================================

# --- Data ---
dataset.path=data/samtaler_50_40_viderestillinger_pipeline.xlsx
# Filen har ingen train/test-opdeling, så alle samtaler bruges
dataset.split=all

# --- Pipeline ---
pipeline.mode=REASON_FIRST

# --- Where the models run ---
llm.provider=OLLAMA
embedding.provider=OLLAMA

# --- Ollama (local) ---
ollama.url=http://localhost:11434
# Bruges kun, når compare.models er tom
ollama.llm.model=qwen2.5:7b
ollama.embedding.model=bge-m3

# --- Modeller der sammenlignes (kommasepareret, køres én ad gangen) ---
# Hver model skal være hentet med "ollama pull <navn>" først. Fejler én, fortsætter de andre.
compare.models=qwen2.5:7b, gemma3:12b, llama3.1:8b, mistral-nemo
# DFM Mimir er taget ud, fordi Ollama ikke kunne køre den. Sæt den ind igen i listen ovenfor,
# når "ollama run hf.co/danish-foundation-models/DFM-Mimir-v1.5-GGUF:Q4_K_M" virker i terminalen.

# --- Hugging Face (API) - bruges ikke her, men skal stå i filen ---
huggingface.llm.url=https://router.huggingface.co/v1/chat/completions
huggingface.llm.model=Qwen/Qwen2.5-72B-Instruct
huggingface.embedding.url=https://router.huggingface.co/hf-inference/models/{model}/pipeline/feature-extraction
huggingface.embedding.model=BAAI/bge-m3

# --- Model settings ---
embedding.batchSize=16
naming.enabled=true

# --- Dimension reduction (UMAP) ---
umap.enabled=true
umap.dimensions=5
# Færre naboer, fordi datasættet kun har 40 samtaler
umap.neighbors=4

# --- Clustering (HDBSCAN) ---
# Hver årsag har kun 2-4 samtaler, så klynger på 2 skal være tilladt
hdbscan.minPoints=2
hdbscan.minClusterSize=2

# --- Output ---
output.dir=results
cache.dir=cache
evaluation.enabled=true
